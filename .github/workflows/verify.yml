name: Build and verify ILMIGO
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ilmigo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    name: Web and curriculum checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ilmigo-ci-fixture-only
          POSTGRES_DB: ilmigo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ilmigo_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate curriculum and web preview
        run: npm run build
      - name: Run regression tests
        run: node --test --test-isolation=none tests/*.test.mjs
      - name: Apply migrations and test PostgreSQL isolation and concurrency
        run: node scripts/check-database.mjs
        env:
          ILMIGO_TEST_DATABASE: 'true'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ilmigo-ci-fixture-only
          PGDATABASE: ilmigo_ci
      - name: Build backend Docker image
        run: docker build -t ilmigo-backend .
      - name: Start disposable backend container
        run: docker run -d --name ilmigo-backend -p 127.0.0.1:3000:3000 ilmigo-backend
      - name: Verify container HTTP and disabled payments
        run: node scripts/check-container.mjs
      - name: Install pinned browser test tool
        run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Verify installed Chrome
        run: google-chrome --version
      - name: Verify browser lesson, family and Urdu mobile flows
        run: node scripts/check-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ilmigo-browser-smoke
          path: review/browser/
          if-no-files-found: ignore
      - name: Remove disposable backend container
        if: always()
        run: docker rm -f ilmigo-backend || true
      - uses: actions/upload-artifact@v4
        with:
          name: ilmigo-web-preview
          path: ILMIGO-preview.html
          if-no-files-found: error
  mobile:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Generate lesson assets
        run: python3 scripts/build_curriculum.py
      - name: Generate native projects and install dependencies
        run: python3 scripts/bootstrap_mobile.py
      - name: Analyze native source
        run: flutter analyze
        working-directory: mobile
      - name: Run Flutter tests
        run: flutter test --reporter expanded --concurrency 1 --timeout 120s --fail-fast
        working-directory: mobile
      - name: Build Android debug APK
        run: flutter build apk --debug
        working-directory: mobile
      - name: Reject release signing without owner credentials
        run: python3 scripts/check-release-signing.py
      - uses: actions/upload-artifact@v4
        with:
          name: ilmigo-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
  ios:
    name: iOS simulator verification
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Generate lesson assets
        run: python3 scripts/build_curriculum.py
      - name: Generate native projects and install dependencies
        run: python3 scripts/bootstrap_mobile.py
      - name: Check owner signing settings against the actual Xcode template
        run: python3 scripts/check-ios-release-template.py
      - name: Analyze native source
        run: flutter analyze
        working-directory: mobile
      - name: Run Flutter tests
        run: flutter test --reporter expanded --concurrency 1 --timeout 120s --fail-fast
        working-directory: mobile
      - name: Build iOS simulator app
        run: flutter build ios --simulator --no-codesign
        working-directory: mobile
      - name: Package simulator artifact
        run: ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app build/ilmigo-ios-simulator.zip
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: ilmigo-ios-simulator
          path: mobile/build/ilmigo-ios-simulator.zip
          if-no-files-found: error
