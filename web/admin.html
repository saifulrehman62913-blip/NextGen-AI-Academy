<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ILMIGO DIGITAL ACADEMY · Course studio</title><link rel="stylesheet" href="/style.css"></head><body><main class="content" style="max-width:950px"><div class="brand"><img src="/icon.svg" alt=""><span class="academy-wordmark">ILMIGO<small>DIGITAL ACADEMY</small></span><span style="font-size:12px;letter-spacing:0">Course studio</span></div><div class="note">Sign in through My space first. An administrator role must be assigned server-side. Drafts never appear in the learner catalog.</div><div class="button-row"><a href="/">← Learning app</a><button class="secondary" id="load">Load courses</button></div><div class="settings-card"><h2>Review and publish a course</h2><form id="course"><label for="language">Language code</label><input id="language" placeholder="en" required><label for="status">Status</label><select id="status"><option value="draft">Draft</option><option value="review">In review</option><option value="published">Published</option></select><label for="lessons">Lessons JSON array (same format as shared/catalog.json)</label><textarea id="lessons" rows="15" style="width:100%;font:12px monospace;padding:15px" required>[]</textarea><label for="note">Language and audio review note</label><input id="note" maxlength="2000"><label><input type="checkbox" id="reviewed"> A qualified reviewer has checked language accuracy, lesson progression and audio availability.</label><button class="primary" id="save">Save course</button></form></div><pre id="result" style="white-space:pre-wrap;overflow-wrap:anywhere" role="status"></pre></main><script type="module" src="/admin.js"></script></body></html>
