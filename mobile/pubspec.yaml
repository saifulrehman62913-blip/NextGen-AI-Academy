publish_to: none
version: 0.6.0+11
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.47.8'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.5
  cryptography: ^2.7.0
  http: ^1.3.0
  flutter_tts: ^4.2.2
  speech_to_text: ^7.5.0
  url_launcher: ^6.3.1
  purchases_flutter: ^8.6.1
dev_dependencies:
